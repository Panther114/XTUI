[package]
name = "xtui"
version = "0.3.7"
edition = "2024"
rust-version = "1.85"
description = "X in your terminal — a read-only, keyboard-first TUI client"
license = "MIT"
repository = "https://github.com/Panther114/XTUI"
homepage = "https://github.com/Panther114/XTUI"
readme = "README.md"
keywords = ["twitter", "x", "tui", "terminal", "ratatui"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
crossterm = "0.29"
dirs = "6.0"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
open = "5.3"
rand = "0.9"
ratatui = "0.30"
ratatui-image = { version = "11", default-features = false, features = ["crossterm"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "gzip", "brotli", "query", "form"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
textwrap = "0.16"
thiserror = "2.0"
tokio = { version = "1.49", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time"] }
unicode-width = "0.2"
url = "2.5"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[dev-dependencies]
tempfile = "3.23"

[profile.release]
lto = "thin"
strip = true
